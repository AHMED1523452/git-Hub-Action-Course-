on:
  push: 
    branches:
      - main
      - "release/**" 
    paths: 
      - "src/**"
  pull_request: 
      branches:
       - main
       - "release/**"

jobs: 
  test:
     runs-on: ubuntu-latest 
     steps:
        - name: checkout repository
          uses: actions/checkout@v2.8.0

        - name: run test
          run: npm test 
